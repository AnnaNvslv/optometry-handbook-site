const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(SALT),iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(IV)},key,u(DATA));
 const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 document.open();document.write(txt);document.close();
}
const f=document.getElementById('f'),e=document.getElementById('e');
f.addEventListener('submit',async ev=>{ev.preventDefault();e.textContent='';const pw=document.getElementById('p').value,rem=document.getElementById('r').checked;
 try{await open(pw);try{if(rem)localStorage.setItem('oh_pw',pw)}catch(_){}}
 catch(_){e.textContent='Неверный пароль'}});
try{const s=localStorage.getItem('oh_pw');if(s)open(s).catch(()=>localStorage.removeItem('oh_pw'))}catch(_){}
